name: Ejecutar análisis y publicar

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 12 1 * *" # el primero de cada mes
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Tests (incluye correr el notebook con datos sintéticos)
        run: python -m pytest -q
      - name: Descargar datos oficiales
        run: python scripts/descargar.py
      - name: Ejecutar el notebook y exportarlo a HTML
        run: jupyter nbconvert --execute --to html --output-dir site --output index analisis.ipynb
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
